[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-power-predictor"
version = "2.0.0"
description = "Wind power generation prediction using weather forecasts"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["wind_power_predictor", "wind_power_predictor.*"]

[tool.setuptools.package-data]
wind_power_predictor = ["configs/*.yaml"]
